[package]
name = "querydeck"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lightweight desktop SQL client for SQL Server and PostgreSQL"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matt-baech/querydeck"
keywords = ["sql", "sql-server", "postgresql", "database", "client"]
categories = ["database", "gui", "development-tools"]

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
futures-util = "0.3.34"
iced = { version = "0.14.0", features = ["tokio", "highlighter", "linux-theme-detection"] }
iced_code = { version = "0.1", path = "../iced_code" }
iced_grid = { version = "0.1", path = "../iced_grid" }
iced_aw = { version = "0.14", default-features = false, features = ["context_menu"] }
iced_fonts = { version = "0.3", features = ["codicon"] }
rfd = "0.17.2"
keyring = "4.2.0"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
uuid = "1.28.0"

# The tray uses the freedesktop StatusNotifierItem protocol on Linux (KDE,
# GNOME with AppIndicator, etc.) and tray-icon on Windows and macOS; see
# src/tray.rs for how each is driven.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

# 0.24 is the newest tray-icon that supports our rust-version.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
